<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">✓</div>
        <div>
          <h1 class="app-title">Task Manager</h1>
          <p class="app-sub">Stay focused. Get things done.</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-num" id="total-count">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="done-count">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="pending-count">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </div>
    </header>

    <!-- ADD TASK FORM -->
    <div class="form-card">
      <h2 class="form-title">Add a new task</h2>
      <div class="form-row">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="What do you need to do?"
          maxlength="100"
        />
        <select id="priority-select" class="priority-select">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button class="add-btn" id="add-btn">+ Add Task</button>
      </div>
      <p class="error-msg" id="error-msg">Please enter a task before adding!</p>
    </div>

    <!-- FILTER BUTTONS -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="high">High Priority</button>
    </div>

    <!-- TASK LIST -->
    <div class="task-list" id="task-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📋</div>
        <p>No tasks yet. Add one above!</p>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
